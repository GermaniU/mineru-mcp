[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-mcp"
version = "0.1.0"
description = "MCP HTTP/SSE server que wrappea MinerU para parsing de documentos a Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.2",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    # Floor for the CA bundle used by httpx: older certifi releases still trust
    # the emSign root whose intermediates were compromised (GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]

[project.scripts]
mineru-mcp = "mineru_mcp.server:main"

[tool.uv]
# uv < 0.13.4 still trusts the compromised emSign CA (GHSA-6q48-6c7w-9gw2).
# uv refuses to venv/sync/lock/`pip install -e .` this project with an older uv.
required-version = ">=0.13.4"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
